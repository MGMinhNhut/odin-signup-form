<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TOP Sign Up Form</title>
</head>
<body>
    <div class="background-container">
        <div class="title">
            <img src="./odin-lined.png" alt="odin logo">
            <h1>ODIN</h1>
        </div>
    </div>
    <div class="main-section">
        <div class="introduction">
            <p>This is not a real online service! you know you need something <br>like this in your life to help you realize your deepest dreams.<br>Sign up <i>now</i> to get started.<br><br>You <i>know</i> you want to.</p>
        </div>
        <div class="main-form">
            <h2>Let's do this</h2>
            <form>
                <div class="left-col">
                    <label for="firstName">FIRST NAME</label>
                    <input type="text" id="firstName" name="firstName">
                    <label for="email">EMAIL</label>
                    <input type="text" id="email" name="email">
                    <label for="password">PASSWORD</label>
                    <input type="text" id="password" name="password" required class="password">
                </div>
                <div class="right-col">
                    <label for="lastName">LAST NAME</label>
                    <input type="text" id="lastName" name="lastName">
                    <label for="phoneNum">PHONE NUMBER</label>
                    <input type="text" id="phoneNum" name="phoneNum">
                    <label for="confirmPass">CONFIRM PASSWORD</label>
                    <input type="text" id="confirmPass" name="confirmPass" required class="confirmPass">
                </div>
            </form>
            <div class="loginSection">
                <button type="submit">Create Account</button>
                <h3>Already have an account? <a href="">Log in</a></h3>
            </div>
        </div>
    </div>
</body>
</html>
